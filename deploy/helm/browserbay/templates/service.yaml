apiVersion: v1
kind: Service
metadata:
  name: {{ include "browserbay.fullname" . }}
  labels:
    {{- include "browserbay.labels" (dict "ctx" . "component" "relay") | nindent 4 }}
  {{- with .Values.relay.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.relay.service.type }}
  ports:
    - name: http
      port: {{ .Values.relay.service.port }}
      targetPort: http
  selector:
    {{- include "browserbay.selectorLabels" (dict "ctx" . "component" "relay") | nindent 4 }}
