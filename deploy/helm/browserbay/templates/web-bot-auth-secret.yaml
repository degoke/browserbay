{{- include "browserbay.validate" . -}}
{{- if and (ne (include "browserbay.signingMode" .) "off") (not .Values.webBotAuth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "browserbay.fullname" . }}-web-bot-auth
  labels:
    {{- include "browserbay.labels" (dict "ctx" . "component" "relay") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.webBotAuth.existingSecretKey }}: {{ .Values.webBotAuth.key | quote }}
{{- end }}
