{{- if and (eq .Values.mode "split") .Values.node.autoscaling.enabled }}
{{- $cpu := .Values.node.autoscaling.targetCPUUtilizationPercentage }}
{{- $memory := .Values.node.autoscaling.targetMemoryUtilizationPercentage }}
{{- if not (or $cpu $memory) }}{{ fail "node.autoscaling needs targetCPUUtilizationPercentage or targetMemoryUtilizationPercentage" }}{{ end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "browserbay.nodeName" . }}
  labels:
    {{- include "browserbay.labels" (dict "ctx" . "component" "node") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "browserbay.nodeName" . }}
  minReplicas: {{ .Values.node.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.node.autoscaling.maxReplicas }}
  metrics:
    {{- if $cpu }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cpu }}
    {{- end }}
    {{- if $memory }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $memory }}
    {{- end }}
  {{- with .Values.node.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
