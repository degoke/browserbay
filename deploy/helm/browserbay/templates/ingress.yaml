{{- if .Values.relay.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "browserbay.fullname" . }}
  labels:
    {{- include "browserbay.labels" (dict "ctx" . "component" "relay") | nindent 4 }}
  {{- with .Values.relay.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.relay.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.relay.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.relay.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "browserbay.fullname" $ }}
                port:
                  number: {{ $.Values.relay.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
