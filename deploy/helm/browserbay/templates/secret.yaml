{{- include "browserbay.validate" . -}}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "browserbay.fullname" . }}
{{- /* On upgrade, keep what the cluster already holds, so keys do not change under running nodes. */ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $apiKey := default (default (randAlphaNum 32) (get $existing "apiKey" | b64dec)) .Values.auth.apiKey }}
{{- $enrollment := default (default (randAlphaNum 32) (get $existing "enrollmentSecret" | b64dec)) .Values.auth.enrollmentSecret }}
{{- if lt (len $apiKey) 16 }}{{ fail "auth.apiKey must be at least 16 characters" }}{{ end }}
{{- if lt (len $enrollment) 16 }}{{ fail "auth.enrollmentSecret must be at least 16 characters" }}{{ end }}
{{- if not (regexMatch "^[A-Za-z0-9_.-]+$" .Values.auth.enrollmentName) }}{{ fail "auth.enrollmentName may only contain letters, digits, _, . and -" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "browserbay.labels" (dict "ctx" . "component" "relay") | nindent 4 }}
type: Opaque
stringData:
  apiKey: {{ $apiKey | quote }}
  enrollmentSecret: {{ $enrollment | quote }}
  enrollmentSecrets: {{ printf "%s:%s" .Values.auth.enrollmentName (sha256sum $enrollment) | quote }}
{{- end }}
