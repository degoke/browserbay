name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: The tag is the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser

  # The client (and the CLI) as an npm package on GitHub Packages: @<owner>/browserbay, with dist/ already built.
  package:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@${{ github.repository_owner }}'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # `pnpm publish` runs `prepare`, which builds dist/ before the package is packed. A pre-release (v1.0.0-rc.1) must not become what `latest`
      # installs. Re-running the workflow (to retry the images, say) skips a version the registry already has.
      - name: Publish the package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        run: |
          spec="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already published"
          else
            pnpm publish --no-git-checks --tag "$DIST_TAG"
          fi

  publish:
    # The images are released only once the package is, so a tag is never half-released.
    needs: [ci, package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the box: Chromium included, runs `start` by default (and `node` or `relay` on request)
          - image: browserbay
            target: box
          # the relay alone, without Chromium
          - image: browserbay-relay
            target: relay
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr.io/<owner>/browserbay and ghcr.io/<owner>/browserbay-relay
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # a pre-release (v1.0.0-rc.1) must not become what `latest` pulls
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          # Nodes run on whatever people have: VPSes, Raspberry Pis, Apple silicon under Docker.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
