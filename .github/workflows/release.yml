name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: The tag is the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      # What a user installs works: the package is packed, installed into an empty project and used.
      - run: pnpm check:package
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser

  # The client (and the CLI) as an npm package on GitHub Packages: @<owner>/browserbay, with dist/ already built.
  package:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@${{ github.repository_owner }}'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # `pnpm publish` runs `prepare`, which builds dist/ before the package is packed. A pre-release (v1.0.0-rc.1) must not become what `latest`
      # installs. Re-running the workflow (to retry the images, say) skips a version the registry already has.
      - name: Publish the package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        run: |
          spec="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          status=0
          bash scripts/npm-published.sh "$spec" || status=$?
          case "$status" in
            0) echo "$spec is already published" ;;
            1) pnpm publish --no-git-checks --tag "$DIST_TAG" ;;
            *)
              echo "::error::Could not tell whether $spec is already published (see the registry error above). Re-run the job."
              exit 1
              ;;
          esac

  # The same package on npmjs.com, where `pnpm add @degoke/browserbay` needs no registry setup and no token. It needs the
  # NPM_TOKEN secret (RELEASING.md says how to make it). The job only STAGES the package: it cannot be installed until a
  # maintainer approves it with 2FA (RELEASING.md says how), so the token does not have to bypass 2FA, and a stolen
  # token cannot put a version live. Provenance ties the package to this workflow run.
  npm:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      # `npm stage publish` needs npm 11.15 or newer, which is newer than the npm that Node 24 ships.
      - run: npm install --global 'npm@^11.15.0'
      - run: npm --version
      # A pre-release (v1.0.0-rc.1) is staged under `next`, so it never becomes what `latest` installs. Re-running the
      # workflow skips a version the registry already has, but a version that is staged and not yet approved is not on
      # the registry: approve or reject it before re-running, or the re-run stages it a second time.
      - name: Stage the package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is not set, so nothing can be published to npm. See RELEASING.md."
            exit 1
          fi
          npm whoami # fails here, and clearly, if the token is wrong or has expired
          spec="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          status=0
          bash scripts/npm-published.sh "$spec" || status=$?
          case "$status" in
            0) echo "$spec is already published" ;;
            1) npm stage publish --ignore-scripts --provenance --access public --tag "$DIST_TAG" ;;
            *)
              echo "::error::Could not tell whether $spec is already published (see the registry error above). Re-run the job."
              exit 1
              ;;
          esac

  publish:
    # The images are released only once the package is on GitHub Packages and staged on npm, so a tag is never half-released.
    # The npm version goes live when a maintainer approves it, which is after the images: the workflow cannot wait for that.
    needs: [ci, package, npm]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the box: Chromium included, runs `start` by default (and `node` or `relay` on request)
          - image: browserbay
            target: box
          # the relay alone, without Chromium
          - image: browserbay-relay
            target: relay
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr.io/<owner>/browserbay and ghcr.io/<owner>/browserbay-relay
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # a pre-release (v1.0.0-rc.1) must not become what `latest` pulls
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          # Nodes run on whatever people have: VPSes, Raspberry Pis, Apple silicon under Docker.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
