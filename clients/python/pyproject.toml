[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "browserbay"
dynamic = ["version"]
description = "Python client for browserbay: self-hosted Chromium browsers, lent out one isolated slot at a time."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adewoye Adegoke" }]
dependencies = []
keywords = ["browser", "chromium", "cdp", "playwright", "puppeteer", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://browserbay.3adelabs.com"
Documentation = "https://browserbay.3adelabs.com/docs/reference/python/"
Repository = "https://github.com/degoke/browserbay"

[tool.setuptools.dynamic]
version = { attr = "browserbay._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
browserbay = ["py.typed"]
